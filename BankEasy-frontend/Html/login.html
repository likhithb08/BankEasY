<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - YourBank</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            color: #ffffff;
            line-height: 1.6;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(212, 255, 0, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        #login-section {
            background: rgba(30, 30, 30, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px 40px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            z-index: 1;
        }

        #login-section h2 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 36px;
            font-weight: 700;
            color: #d4ff00;
            text-shadow: 0 0 20px rgba(212, 255, 0, 0.3);
        }

        .subtitle {
            text-align: center;
            margin-bottom: 35px;
            font-size: 14px;
            color: #999;
            line-height: 1.5;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #cccccc;
            font-size: 14px;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 18px;
            background: rgba(40, 40, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            font-size: 14px;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #d4ff00;
            background: rgba(40, 40, 40, 0.8);
            box-shadow: 0 0 0 3px rgba(212, 255, 0, 0.1);
        }

        input::placeholder {
            color: #666;
        }

        .forgot-password {
            text-align: right;
            margin-top: 8px;
        }

        .forgot-password a {
            color: #d4ff00;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #e5ff33;
            text-decoration: underline;
        }

        button {
            background: #d4ff00;
            color: #1a1a1a;
            border: none;
            padding: 16px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        button:hover {
            background: #e5ff33;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 255, 0, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 25px 0;
            color: #666;
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .divider span {
            padding: 0 15px;
        }

        .social-login {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(40, 40, 40, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .social-btn:hover {
            background: rgba(60, 60, 60, 0.8);
            border-color: #d4ff00;
            transform: translateY(-3px);
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 14px;
        }

        .signup-link a {
            color: #d4ff00;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .signup-link a:hover {
            color: #e5ff33;
            text-decoration: underline;
        }

        br {
            display: none;
        }

        @media (max-width: 768px) {
            body {
                padding: 15px;
            }

            #login-section {
                padding: 40px 25px;
                max-width: 100%;
            }

            #login-section h2 {
                font-size: 28px;
            }
        }

        @media (max-width: 480px) {
            #login-section {
                padding: 30px 20px;
            }

            input[type="text"],
            input[type="password"] {
                padding: 12px 16px;
            }

            button {
                padding: 14px 20px;
            }
        }
    </style>
</head>

<body>
    <div id="login-section">
        <h2>Login</h2>
        <p class="subtitle">Welcome back! Please log in to access your account.</p>

        <form>
            <div class="form-group">
                <label for="loginUsername">Enter your Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your Email" required>
            </div>

            <div class="form-group">
                <label for="loginPassword">Enter your Password</label>
                <div class="input-wrapper">
                    <input type="password" id="loginPassword" placeholder="Enter your Password" required>
                </div>
                <div class="forgot-password">
                    <a href="#">Forgot Password?</a>
                </div>
            </div>

            <button type="button" onclick="validateUser()">Login</button>
        </form>

        <div class="signup-link">
            Don't have an account? <a href="register.html">Sign Up</a>
        </div>
    </div>

    <script>
        async function validateUser() {
            let username = document.getElementById("loginUsername").value;
            let password = document.getElementById("loginPassword").value;

            let loginReq = {
                username,
                password
            }

            try {
                let response = await fetch("http://localhost:8080/api/auth/login", {
                    method: 'POST',
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(loginReq)
                })

                let user = await response.json();

                if (user && user.username) {
                    //saveing the session
                    localStorage.setItem("activeUser", user.username)
                    localStorage.setItem("user", JSON.stringify(user))
                    window.location.href = "Dashboard.html"
                } else {
                    alert("Invalid credentials..!")
                }
            } catch (e) {
                alert("Login Failed")
                console.log(e)
            }
        }
    </script>

</body>

</html>
